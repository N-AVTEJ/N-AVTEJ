<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250" role="img"><style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
@keyframes strike{0%,84%,100%{opacity:0}86%{opacity:1}88%{opacity:.15}91%{opacity:1}95%{opacity:0}}
@keyframes flash{0%,84%,100%{opacity:0}86%{opacity:.22}91%{opacity:.3}95%{opacity:0}}
@keyframes crackle{to{stroke-dashoffset:-60}}
@keyframes hum{0%,100%{opacity:.35}50%{opacity:.7}}
.b1{animation:strike 4.6s linear infinite} .b2{animation:strike 6.3s linear infinite 1.9s}
.fl{animation:flash 4.6s linear infinite} .ar{stroke-dasharray:6 10;animation:crackle 1.2s linear infinite}
.hum{animation:hum 2.4s ease-in-out infinite}
</style><defs><radialGradient id="sg" cx="1" cy="0" r="1"><stop offset="0" stop-color="#38BDF8" stop-opacity=".30"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><filter id="bl" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="490" height="250" rx="20" fill="#0a1020" stroke="#1d2c4d"/><rect width="490" height="250" rx="20" fill="url(#sg)"/><clipPath id="sc2"><rect width="490" height="250" rx="20"/></clipPath><g clip-path="url(#sc2)"><path class="hum" d="M446 0 L420 66 L448 74 L402 148 L430 156 L384 250" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity=".5"/><path class="ar" d="M300 0 L286 38 L304 42 L278 92 M446 0 L400 120" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity=".6"/><g class="b1" opacity="0"><path d="M446 0 L420 66 L448 74 L402 148 L430 156 L384 250" fill="none" stroke="#38BDF8" stroke-width="7.199999999999999" stroke-linejoin="round" filter="url(#bl)"/><path d="M446 0 L420 66 L448 74 L402 148 L430 156 L384 250" fill="none" stroke="#CDEBFF" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></g><g class="b1" opacity="0"><path d="M420 66 L394 98 L408 104" fill="none" stroke="#38BDF8" stroke-width="4.800000000000001" stroke-linejoin="round" filter="url(#bl)"/><path d="M420 66 L394 98 L408 104" fill="none" stroke="#CDEBFF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></g><g class="b2" opacity="0"><path d="M300 0 L286 38 L304 42 L278 92" fill="none" stroke="#38BDF8" stroke-width="5.4" stroke-linejoin="round" filter="url(#bl)"/><path d="M300 0 L286 38 L304 42 L278 92" fill="none" stroke="#CDEBFF" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g><rect class="fl" opacity="0" width="490" height="250" fill="#7CC4FF"/></g><text x="28" y="36" font-size="12" fill="#38BDF8" font-weight="600" text-anchor="start" class="m" >05</text><text x="462" y="36" font-size="12" fill="#7F93B8" font-weight="400" text-anchor="end" class="m" >REPO ↗</text><text x="28" y="80" font-size="30" fill="#EAF4FF" font-weight="800" text-anchor="start" >AutoDoc AI</text><text x="28" y="110" font-size="14" fill="#AFC3E0" font-weight="400" text-anchor="start" >Generates code documentation and detects doc drift when</text><text x="28" y="130" font-size="14" fill="#AFC3E0" font-weight="400" text-anchor="start" >the code changes but the docs don't.</text><path d="M36 145 L30 153 L34 153 L32 159 L39 151 L35 151 Z" fill="#38BDF8"/><text x="46" y="156" font-size="13" fill="#38BDF8" font-weight="500" text-anchor="start" >Multi-provider LLMs (Gemini, Anthropic, OpenAI) with a</text><text x="46" y="174" font-size="13" fill="#38BDF8" font-weight="500" text-anchor="start" >free tier.</text><rect x="28" y="212" width="75" height="22" rx="11" fill="#0f1a33" stroke="#25396a"/><text x="65.7" y="227" font-size="11" fill="#DCEEFF" font-weight="500" text-anchor="middle" class="m" >Vercel KV</text><rect x="111" y="212" width="56" height="22" rx="11" fill="#0f1a33" stroke="#25396a"/><text x="139.2" y="227" font-size="11" fill="#DCEEFF" font-weight="500" text-anchor="middle" class="m" >Gemini</text><rect x="175" y="212" width="56" height="22" rx="11" fill="#0f1a33" stroke="#25396a"/><text x="202.8" y="227" font-size="11" fill="#DCEEFF" font-weight="500" text-anchor="middle" class="m" >Claude</text><rect x="239" y="212" width="56" height="22" rx="11" fill="#0f1a33" stroke="#25396a"/><text x="266.4" y="227" font-size="11" fill="#DCEEFF" font-weight="500" text-anchor="middle" class="m" >OpenAI</text></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250" role="img"><style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
@keyframes blink{50%{opacity:0}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{from{transform:translateX(-160px)}to{transform:translateX(780px)}}
.cur{animation:blink 1s steps(1) infinite} .dot{animation:pulse 1.6s ease-in-out infinite}
.scan{animation:scan 5s linear infinite}
</style><defs><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1d241d"/></pattern><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#C8FF00" stop-opacity=".16"/><stop offset="1" stop-color="#C8FF00" stop-opacity="0"/></radialGradient><linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#C8FF00" stop-opacity="0"/><stop offset=".5" stop-color="#C8FF00" stop-opacity=".10"/><stop offset="1" stop-color="#C8FF00" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="490" height="250" rx="20" fill="#0e110e" stroke="#232b23"/><rect x="0" y="0" width="490" height="250" rx="20" fill="url(#glow)"/><text x="28" y="36" font-size="12" fill="#C8FF00" font-weight="600" text-anchor="start" class="m" >02</text><text x="462" y="36" font-size="12" fill="#8A9587" font-weight="400" text-anchor="end" class="m" >LIVE ↗  ·  REPO ↗</text><text x="28" y="80" font-size="30" fill="#ECF1E6" font-weight="800" text-anchor="start" >BuildMate</text><text x="28" y="110" font-size="14" fill="#B5BFB1" font-weight="400" text-anchor="start" >Marketplace for student academic projects. Quotation,</text><text x="28" y="130" font-size="14" fill="#B5BFB1" font-weight="400" text-anchor="start" >locked scope, payment, then delivery unlock.</text><text x="28" y="156" font-size="13" fill="#C8FF00" font-weight="500" text-anchor="start" >★ Server-authoritative: payments, deadlines and delivery</text><text x="28" y="174" font-size="13" fill="#C8FF00" font-weight="500" text-anchor="start" >   gating are never trusted from the client.</text><rect x="28" y="212" width="69" height="22" rx="11.0" fill="#171c17" stroke="#2a342a"/><text x="62.4" y="227.0" font-size="11" fill="#ECF1E6" font-weight="500" text-anchor="middle" class="m" >Razorpay</text><rect x="105" y="212" width="95" height="22" rx="11.0" fill="#171c17" stroke="#2a342a"/><text x="152.39999999999998" y="227.0" font-size="11" fill="#ECF1E6" font-weight="500" text-anchor="middle" class="m" >Google OAuth</text><rect x="208" y="212" width="42" height="22" rx="11.0" fill="#171c17" stroke="#2a342a"/><text x="229.2" y="227.0" font-size="11" fill="#ECF1E6" font-weight="500" text-anchor="middle" class="m" >RBAC</text><rect x="258" y="212" width="56" height="22" rx="11.0" fill="#171c17" stroke="#2a342a"/><text x="286.2" y="227.0" font-size="11" fill="#ECF1E6" font-weight="500" text-anchor="middle" class="m" >Vercel</text></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img"><style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes strike{0%,86%,100%{opacity:.14}87%{opacity:1}88%{opacity:.25}89%{opacity:1}90%{opacity:.5}91%{opacity:1}95%{opacity:.14}}
@keyframes flash{0%,86%,100%{opacity:0}87%{opacity:.20}88%{opacity:.04}89%{opacity:.26}90%{opacity:.08}91%{opacity:.18}95%{opacity:0}}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.cur{animation:blink 1s steps(1) infinite} .dot{animation:pulse 1.6s ease-in-out infinite}
.bolt{opacity:.14;animation:strike 6s linear infinite} .flash{opacity:0;animation:flash 6s linear infinite}
.cloud{animation:drift 9s ease-in-out infinite alternate}
</style><defs>
<pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#14214a"/></pattern>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3FA9FF" stop-opacity=".22"/><stop offset="1" stop-color="#3FA9FF" stop-opacity="0"/></radialGradient>
<radialGradient id="cloud" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2a4fb0" stop-opacity=".55"/><stop offset="1" stop-color="#2a4fb0" stop-opacity="0"/></radialGradient>
<filter id="bg" x="-80%" y="-30%" width="260%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><rect x="0" y="0" width="1000" height="120" rx="20" fill="#080d1a" stroke="#17264c"/><rect x="0" y="0" width="1000" height="120" rx="20" fill="url(#g)"/><rect x="0" y="0" width="1000" height="120" rx="20" fill="url(#glow)"/><rect class="flash" style="animation-delay:0.5s" x="0" y="0" width="1000" height="120" rx="20" fill="#3FA9FF"/><g transform="translate(640,0) scale(0.9,0.9)" class="bolt" style="animation-delay:0.5s" filter="url(#bg)"><path d="M22,0 L8,40 L23,43 L5,84 L17,87 L0,130" fill="none" stroke="#3FA9FF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M23,43 L38,66 L29,68 L42,92" fill="none" stroke="#3FA9FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M22,0 L8,40 L23,43 L5,84 L17,87 L0,130" fill="none" stroke="#D6EEFF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M23,43 L38,66 L29,68 L42,92" fill="none" stroke="#D6EEFF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g><g transform="translate(520,0) scale(-0.6,0.6)" class="bolt" style="animation-delay:1.1s" filter="url(#bg)"><path d="M22,0 L8,40 L23,43 L5,84 L17,87 L0,130" fill="none" stroke="#3FA9FF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M23,43 L38,66 L29,68 L42,92" fill="none" stroke="#3FA9FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M22,0 L8,40 L23,43 L5,84 L17,87 L0,130" fill="none" stroke="#D6EEFF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M23,43 L38,66 L29,68 L42,92" fill="none" stroke="#D6EEFF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g><text x="32" y="62" font-size="28" fill="#EAF4FF" font-weight="800" text-anchor="start" textLength="560" lengthAdjust="spacingAndGlyphs">Ship fast. Learn faster. Build smarter.</text><rect class="cur" x="602" y="40" width="12" height="26" fill="#3FA9FF"/><text x="32" y="94" font-size="13" fill="#7F93B5" font-weight="400" text-anchor="start" class="m" >Open to internships · collaborations · hackathon teams</text><text x="968" y="58" font-size="17" fill="#3FA9FF" font-weight="600" text-anchor="end" class="m" >madipadiganavtej@gmail.com</text><text x="968" y="88" font-size="14" fill="#7F93B5" font-weight="400" text-anchor="end" class="m" >github.com/N-AVTEJ</text></svg>
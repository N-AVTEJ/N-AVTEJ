  <g font-family="'JetBrains Mono', 'Fira Code', monospace">
    <text x="40" y="82" font-size="14" fill="#5c8a6d">$ whoami</text>

    <text x="40" y="122" font-size="46" font-weight="700" fill="#0a2f1a" letter-spacing="1">NAVTEJ MADIPADIGA</text>
    <text x="40" y="122" font-size="46" font-weight="700" fill="#39ff14" letter-spacing="1" filter="url(#soft)">NAVTEJ MADIPADIGA</text>
    <text x="43" y="121" font-size="46" font-weight="700" fill="#7dffb0" letter-spacing="1" opacity="0.35">NAVTEJ MADIPADIGA</text>

    <text x="40" y="152" font-size="16" fill="#8ce6ab">&gt; full-stack developer <tspan fill="#3d6b4d">//</tspan> ai-ml engineer</text>


    <text x="450" y="29" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#5c8a6d" letter-spacing="2">navtej@dev-machine: ~/portfolio — 96x30</text>
    <line x1="0" y1="42" x2="900" y2="42" stroke="#1c4a2c" stroke-width="1"/>
